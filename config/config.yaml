project_name: "Hybrid Image Encryption ML Analysis"
version: "1.0.0"

paths:
  raw_data: "datasets/raw"
  processed_data: "datasets/processed"
  encrypted_data: "datasets/encrypted"
  decrypted_data: "datasets/decrypted"
  models_path: "outputs/models"
  logs_path: "logs/system.log"

encryption:
  algorithm: "Hybrid-Permutation-XOR"
  key_size: 256
  block_size: 16

ml_settings:
  batch_size: 32
  epochs: 50
  input_shape: [256, 256, 3]
  learning_rate: 0.001

logging:
  level: "INFO"
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"